name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels its older run; main runs are never
# cancelled so every merge commit gets a result. A label change re-runs the
# same head and must not cancel the run that is still producing its results.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tool versions
        run: |
          node --version
          python3 --version
          shellcheck --version
      - name: Gates
        run: scripts/gates

  # Validates every changelog fragment and requires one unless the pull request
  # carries `no-changelog`. Needs the full history for the base commit.
  changelog:
    name: changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the fragments
        run: scripts/changelog check
      - name: Require a fragment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: scripts/require-fragment

  ci:
    name: ci
    needs: [gates, changelog]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job ended with '$r'"; exit 1 ;;
            esac
          done
